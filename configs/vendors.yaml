pipeline:
  max_retries: 3
  timeout_seconds: 30
  rate_limit_delay_seconds: 1.5
  enable_ssrf_protection: true
  enable_csv_sanitization: true
  max_site_crawl_pages: 5
storage:
  master_csv_path: output/all_vendors_lifecycle.csv
  per_vendor_json_dir: output
  artifacts_dir: artifacts/runs
observability:
  enable_alerts: true
  alert_ltb_threshold_days: 90
  webhook_url: ''
  alert_on_zero_records: true
  alert_on_errors: true
