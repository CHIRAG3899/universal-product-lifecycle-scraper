pipeline:
  max_retries: 3
  timeout_seconds: 30
  rate_limit_delay_seconds: 1.5
  enable_ssrf_protection: true
  enable_csv_sanitization: true
  max_site_crawl_pages: 5
storage:
  master_csv_path: output/all_vendors_lifecycle.csv
  per_vendor_json_dir: output
  artifacts_dir: artifacts/runs
observability:
  enable_alerts: true
  alert_ltb_threshold_days: 90
  webhook_url: ''
  alert_on_zero_records: true
  alert_on_errors: true
vendors:
  mitsubishi:
    id: mitsubishi
    name: Mitsubishi Electric
    sector: OT
    sectors:
    - OT
    - IoT
    website: https://www.mitsubishielectric.com
    allowed_domains:
    - mitsubishielectric.com
    - contentstack.com
    - mitsubishielectricfa.com
    - mitsubishielectric.co.jp
    entry_points:
    - name: Europe_FA_EOL_Portal
      url: https://se-fa.mitsubishielectric.com/fa/se_en/support/product-life-cycle-stage-eol
      strategy: dom_table
      crawler_type: dom_table
      crawler_mode: http
      region: Europe
      endpoint_role: model_status_table
      category: Industrial Automation
      source_tags:
      - dated_EOL_LTB_EOS
      - lifecycle_source_candidate
      - model_status_or_notice_candidate
      - model_status_table
      expected_fields:
      - series/product/model
      - affected model list
      - EOL date
      - LTB date
      - EOS date
      confidence: low
      confidence_reason: The page structure is highly inconsistent and poorly formatted
        for programmatic ingestion. The table rows lack semantic headers, and the
        content is fragmented (e.g., separating model names from dates). Furthermore,
        the 'tested_product_pattern' resulted in false-positive noise ('cnt', 'cncs')
        which does not represent valid Mitsubishi Electric SKUs, indicating the current
        regex approach is ineffective for this layout.
      review_needed: true
    - name: Nordic_FA_EOL_Portal
      url: https://no-fa.mitsubishielectric.com/fa/no_en/support/Product-Life-Cycle-Information
      strategy: dom_table
      crawler_type: dom_table
      crawler_mode: http
      region: Nordic
      endpoint_role: model_status_table
      category: Industrial Automation
      source_tags:
      - dated_EOL_LTB_EOS
      - lifecycle_source_candidate
      - model_status_or_notice_candidate
      confidence: low
      confidence_reason: The endpoint provides lifecycle information, but the current
        regex pattern is entirely ineffective. The extracted models ('cnt', 'cncs')
        are generic stopwords or non-specific segments rather than valid Mitsubishi
        Electric SKUs (which typically follow patterns like 'GT25-WLAN', 'Q03UDVCPU',
        etc.). Furthermore, the table structure is non-standard, and the data is often
        buried in unstructured text or PDF links rather than a parsable catalog table.
      review_needed: true
    - name: Mitsubishi Electric Factory Automation Product Life Cycle Table
      url: https://no-fa.mitsubishielectric.com/fa/support/Product-Life-Cycle-Information?redirect_from_legacy=1
      strategy: dom_table
      crawler_type: dom_table
      confidence: low
      confidence_reason: The provided URL is an authoritative official source, but
        the current extraction logic is failing. The 'sample_extracted_models' output
        shows generic noise ('cnt', 'cncs') instead of actual SKUs like 'GT25-WLAN'.
        Furthermore, the tested regex pattern does not match the actual structure
        of the provided page content, indicating a failure to correctly parse the
        DOM table for product identifiers.
      evidence_authority: official_model_status_or_notice_evidence
      review_needed: true
