name: Scheduled Multi-Vendor Lifecycle Scraper

on:
  # Schedule: Every Sunday at 2:30 AM IST (21:00 UTC on Saturday)
  # Note: 21:00 UTC Saturday + 5h30m = 02:30 IST Sunday
  schedule:
    - cron: '0 21 * * 6'

  # Allows manual execution on demand from the GitHub UI
  workflow_dispatch:
    inputs:
      vendor_target:
        description: 'Vendor target to scrape (all or specific vendor id)'
        required: true
        default: 'all'
      gemini_model:
        description: 'Google Gemini Model'
        required: false
        default: 'gemini-2.5-flash'

permissions:
  contents: write
  actions: read

jobs:
  scrape-and-monitor:
    name: Run Crawl4AI & Gemini Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Enterprise Lifecycle Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-2.5-flash' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          HEADLESS: "true"
        run: |
          python cli.py --all-vendors

      - name: Upload Master CSV & Vendor Datasets
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-datasets
          path: |
            output/all_vendors_lifecycle.csv
            output/*_lifecycle.json
          retention-days: 90

      - name: Upload Traceability Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: execution-run-artifacts
          path: artifacts/runs/
          retention-days: 30

      - name: Commit & Push Updated Datasets (Optional Git Persistence)
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/all_vendors_lifecycle.csv output/*_lifecycle.json || true
          git diff --staged --quiet || (git commit -m "chore(data): auto-update lifecycle dataset [skip ci]" && git push)
