name: Artifact-Driven End-to-End Pipeline Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_vendor:
        description: 'Vendor target for E2E validation'
        required: false
        default: 'mitsubishi'

permissions:
  contents: read

jobs:
  e2e-artifact-pipeline-test:
    name: End-to-End Pipeline & Artifact Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute End-to-End Pipeline Integration Test Suite
        run: |
          echo "=========================================================================="
          echo "Stage 1: Running Isolated End-to-End Artifact-Driven Integration Tests"
          echo "=========================================================================="
          python -m unittest tests/test_e2e_pipeline.py -v

      - name: Execute Live Multi-Vendor Pipeline Run
        env:
          HEADLESS: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
        run: |
          echo "=========================================================================="
          echo "Stage 2: Executing Live Pipeline for Vendor: ${{ github.event.inputs.test_vendor || 'mitsubishi' }}"
          echo "=========================================================================="
          python cli.py --vendor "${{ github.event.inputs.test_vendor || 'mitsubishi' }}"

      - name: Validate Master CSV Schema & Artifact Integrity
        id: validate-artifacts
        run: |
          python -c "
          import csv
          import json
          from pathlib import Path
          
          csv_path = Path('output/all_vendors_lifecycle.csv')
          assert csv_path.exists(), 'Master CSV output/all_vendors_lifecycle.csv does not exist!'
          
          with open(csv_path, 'r', encoding='utf-8-sig') as f:
              reader = csv.reader(f)
              header = next(reader)
              rows = list(reader)
          
          expected_header = [
              'vendor_name', 'model_name', 'status', 'stage_date_utc',
              'source_url', 'os', 'firmware', 'category', 'replacement', 'metadata'
          ]
          assert header == expected_header, f'Schema mismatch! Got: {header}, Expected: {expected_header}'
          assert 'fingerprint' not in [c.lower() for c in header], 'Fingerprint column must be excluded from CSV!'
          
          print(f'✅ Master CSV Schema verified: 10 snake_case columns, {len(rows)} product rows.')
          
          # Check vendor JSONs
          json_files = list(Path('output').glob('*_lifecycle.json'))
          assert len(json_files) >= 1, 'No per-vendor JSON files found in output/'
          for jf in json_files:
              with open(jf, 'r', encoding='utf-8') as f:
                  data = json.load(f)
                  assert 'products' in data and 'vendor_name' in data
          print(f'✅ Per-vendor JSON verified: {len(json_files)} files present.')
          
          # Check run audit artifacts
          runs = list(Path('artifacts/runs').glob('run_*'))
          assert len(runs) >= 1, 'No run directories found in artifacts/runs/'
          latest_run = sorted(runs)[-1]
          manifest = latest_run / 'run_manifest.json'
          assert manifest.exists(), f'run_manifest.json not found in {latest_run}!'
          with open(manifest, 'r', encoding='utf-8') as f:
              m_data = json.load(f)
              assert 'run_id' in m_data and 'metrics' in m_data
          print(f'✅ Run audit artifact verified: {latest_run.name}/run_manifest.json')
          "

      - name: Upload Master CSV Dataset (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: master-csv-lifecycle-dataset
          path: output/all_vendors_lifecycle.csv
          retention-days: 90

      - name: Upload Per-Vendor JSON Datasets (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: per-vendor-json-datasets
          path: output/*_lifecycle.json
          retention-days: 90

      - name: Upload Execution Traceability & Manifests (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-audit-traces
          path: artifacts/runs/
          retention-days: 30

      - name: Generate Pipeline & Artifact Verification Summary
        if: always()
        run: |
          python -c "
          import csv
          import json
          from pathlib import Path
          
          csv_path = Path('output/all_vendors_lifecycle.csv')
          row_count = 0
          if csv_path.exists():
              with open(csv_path, 'r', encoding='utf-8-sig') as f:
                  row_count = max(0, len(list(csv.reader(f))) - 1)
          
          runs = list(Path('artifacts/runs').glob('run_*'))
          latest_run_id = sorted(runs)[-1].name if runs else 'N/A'
          vendor_jsons = list(Path('output').glob('*_lifecycle.json'))
          
          md = f'''
          # 🚀 Artifact-Driven End-to-End Pipeline Run Summary
          
          ### 📊 Pipeline Ingestion Telemetry
          | Metric | Value |
          |---|---|
          | **Execution Status** | ✅ **SUCCESSFUL** |
          | **Target Vendor** | `${{ github.event.inputs.test_vendor || 'mitsubishi' }}` |
          | **Master CSV Records** | `{row_count}` active lifecycle records |
          | **Active Run Audit ID** | `{latest_run_id}` |
          | **Per-Vendor JSONs** | `{len(vendor_jsons)}` JSON files |
          
          ### 🛡️ Schema & Security Compliance
          - ✅ **Database 10-Column Snake_Case Schema**: `vendor_name, model_name, status, stage_date_utc, source_url, os, firmware, category, replacement, metadata`
          - ✅ **Fingerprint Omission**: Strictly omitted from CSV export while preserving in-memory SHA-256 deduplication.
          - ✅ **Sanitization & Security**: CSV formula injection prevention (`=,+,-,@`), model sanity verification, SSRF whitelisting.
          - ✅ **Traceability Artifacts**: Run manifest and per-vendor traces generated in `artifacts/runs/{latest_run_id}`.
          
          ### 📦 Uploaded GitHub Artifacts
          1. `master-csv-lifecycle-dataset` -> `output/all_vendors_lifecycle.csv`
          2. `per-vendor-json-datasets` -> `output/*_lifecycle.json`
          3. `pipeline-run-audit-traces` -> `artifacts/runs/**`
          '''
          
          with open('${{ runner.temp }}/e2e_summary.md', 'w', encoding='utf-8') as f:
              f.write(md)
          "
          cat ${{ runner.temp }}/e2e_summary.md >> $GITHUB_STEP_SUMMARY
