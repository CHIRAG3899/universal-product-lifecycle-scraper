name: Unit & Regression Tests (All Code Files)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-all-files:
    name: Run Unit & Edge Tests across All Modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Discover and Run All Test Suites
        run: |
          echo "=========================================================================="
          echo "Executing Unit & Edge Case Test Suites across All 17 Test Modules"
          echo "=========================================================================="
          python -m unittest discover tests -v

      - name: Publish Test Summary
        if: always()
        run: |
          python -c "
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          runner = unittest.TextTestRunner(verbosity=0)
          res = runner.run(suite)
          total = res.testsRun
          failed = len(res.failures)
          errored = len(res.errors)
          passed = total - failed - errored
          
          summary = f'''
          ## 🧪 Test Execution Results Summary (Python ${{ matrix.python-version }})
          | Metric | Count | Status |
          |---|---|---|
          | **Total Tests** | {total} | 📋 Complete Suite |
          | **Passed** | {passed} | ✅ Green |
          | **Failures** | {failed} | {'❌' if failed > 0 else '✅ None'} |
          | **Errors** | {errored} | {'❌' if errored > 0 else '✅ None'} |
          | **Success Rate** | {(passed/total*100):.1f}% | {'🏆 100%' if passed == total else '⚠️ Issues'} |
          '''
          with open('${{ runner.temp }}/test_summary.md', 'w', encoding='utf-8') as f:
              f.write(summary)
          "
          cat ${{ runner.temp }}/test_summary.md >> $GITHUB_STEP_SUMMARY
